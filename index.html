<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Generator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 8px; margin-bottom: 5px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        button.secondary { background-color: #6c757d; }
        #output { margin-top: 20px; white-space: pre-wrap; background: #2d2d2d; color: #00ff00; padding: 15px; border-radius: 4px; min-height: 100px; display: none;}
        .error { color: #ff4d4d; }
    </style>
</head>
<body>

<div class="container">
    <h2>Bundle Image Generator</h2>

    <div class="form-group">
        <label>Bottles/Jars Directory:</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="bottles-path" placeholder="No folder selected" readonly>
            <button class="secondary" id="btn-bottles">Select</button>
        </div>
    </div>

    <div class="form-group">
        <label>Swatches Directory:</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="swatches-path" placeholder="No folder selected" readonly>
            <button class="secondary" id="btn-swatches">Select</button>
        </div>
    </div>

    <div class="form-group">
        <label>Output Directory:</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="output-path" placeholder="No folder selected" readonly>
            <button class="secondary" id="btn-output">Select</button>
        </div>
    </div>

    <div class="form-group">
        <label>Generation Type:</label>
        <select id="gen-type">
            <option value="bottles">Bottles</option>
            <option value="bottles-combined">Bottles Combined (3, 6, 12)</option>
            <option value="gelish_dip">Gelish Dip Swatches</option>
            <option value="gelish_gel">Gelish Gel Swatches</option>
            <option value="gelish_mt">Gelish MT Swatches</option>
        </select>
    </div>

    <hr>

    <button id="btn-generate">Generate Images</button>

    <div id="output"></div>
</div>

<script src="renderer.js"></script>
</body>
</html>
